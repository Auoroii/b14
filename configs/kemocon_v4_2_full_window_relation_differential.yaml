paths:
  data_root: data/K-EmoCon
  manifest: artifacts/kemocon/manifest_self.json
  wavlm_model: models/wavlm-base
  output_dir: runs/kemocon_v4_2_bounded_multitask_sampling_only_seed2026

dataset:
  annotation_perspective: self
  channels:
    - bvp
    - eda
    - temperature
  window_seconds: 5.0
  speech_sample_rate_hz: 16000
  physio_target_sample_rate_hz: 64.0
  label_protocol: official_mid_high
  speech_activity:
    enabled: true
    frame_ms: 20
    hop_ms: 10
    rms_threshold: 0.0001
    availability_policy: source_presence

split:
  strategy: label_stratified_rotating_folds
  num_folds: 5
  fold_index: 0
  seed: 2026

model:
  variant: lightweight_shared_dynamic_relation_differential_full_window
  speech_embedding_dim: 128
  noise_embedding_dim: 16
  physiology_stem_channels:
    - 8
    - 16
  physiology_embedding_dim: 64
  fusion_dim: 64
  classifier_hidden_dim: 64
  film_scale: 0.1
  fusion_gate_hidden_dim: 32
  differential_dim: 32
  differential_heads: 4
  differential_lambda_init: 0.5
  differential_residual_scale: 0.1
  condition_gate_on_noise: true
  dropout: 0.3
  freeze_wavlm: true
  unfreeze_last_n_layers: 0
  emotion_layer_aggregation: fixed_mean

loss:
  kind: weighted_cross_entropy
  focal_gamma: 2.0
  fused_weight: 1.0
  speech_aux_weight: 0.3
  physiology_aux_weight: 0.1
  class_weight_power: 0.5

training:
  modality_mode: multimodal
  device: cuda
  seed: 42
  batch_size: 32
  num_workers: 16
  pin_memory: true
  epochs: 100
  learning_rate: 0.0001
  wavlm_learning_rate: 0.0001
  weight_decay: 0.001
  max_gradient_norm: 1.0
  early_stopping_patience: 12
  checkpoint_selection_metric: calibrated_participant_mean_macro_f1
  lr_scheduler_enabled: true
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 3
  min_learning_rate: 0.000001
  speech_modality_dropout: 0.1
  physiology_modality_dropout: 0.1
  sampling_policy: bounded_multitask_participant_balanced
  arousal_low_sampling_mass: 0.35
  valence_low_sampling_mass: 0.35
  max_sampling_weight_ratio: 20.0
  threshold_calibration_enabled: true
  evaluate_ablation: true
